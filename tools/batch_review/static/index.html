<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batch Review</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="top">
  <b class="brand">Batch Review</b>
  <label>Batch <select id="batch"></select></label>
  <span class="seg" title="Where the labels come from">
    <button id="srcFile" class="on" type="button">Export file</button><button id="srcLive" type="button">Live Scalabel</button>
  </span>
  <button id="refresh" type="button" title="Reload batches, CSV and CAD list from disk">Reload</button>
  <input id="search" list="names" placeholder="Find image by name…" autocomplete="off">
  <datalist id="names"></datalist>
  <span id="status" class="muted"></span>
</header>

<div id="main">
  <aside id="side">
    <h3>Category</h3>
    <div id="cats"></div>
    <div class="row"><button id="catAll" type="button">All</button><button id="catNone" type="button">None</button></div>
    <h3>Display</h3>
    <label class="chk"><input type="checkbox" id="showLines" checked> Show lines</label>
    <label class="chk"><input type="checkbox" id="showVerts"> Show vertices</label>
    <label class="chk"><input type="checkbox" id="keepZoom"> Keep zoom between images</label>
    <label class="sl">Line width <input type="range" id="lineW" min="1" max="8" step="0.5" value="2.5"></label>
    <label class="sl">Line opacity <input type="range" id="lineO" min="0.2" max="1" step="0.05" value="1"></label>
    <label class="sl">Brightness <input type="range" id="bright" min="0.5" max="2" step="0.05" value="1"></label>
    <h3>Keys</h3>
    <div class="keys">
      <div><kbd>←</kbd><kbd>→</kbd> previous / next</div>
      <div><kbd>G</kbd> jump to number</div>
      <div><kbd>F</kbd> fit &nbsp;<kbd>+</kbd><kbd>-</kbd> zoom</div>
      <div><kbd>O</kbd> open in Scalabel</div>
      <div><kbd>M</kbd> Google Maps &nbsp;<kbd>S</kbd> Street View</div>
      <div><kbd>L</kbd> copy lat, lon</div>
      <div><kbd>H</kbd> hide / show lines</div>
      <div><kbd>1</kbd>…<kbd>9</kbd> toggle a category</div>
    </div>
  </aside>

  <section id="work">
    <div id="info">
      <div class="line1">
        <span id="pos" class="pos"></span>
        <span id="fname" class="mono copyable" title="Click to copy"></span>
        <a id="openSc" class="btn primary" target="_blank" rel="noopener">Open in Scalabel</a>
        <span id="taskItem" class="muted"></span>
      </div>
      <div class="line2">
        <span id="geo"></span>
        <span id="cad"></span>
      </div>
    </div>
    <div id="viewbar">
      <button id="zIn" type="button" title="Zoom in (+)">+</button>
      <button id="zOut" type="button" title="Zoom out (-)">&minus;</button>
      <button id="zFit" type="button" title="Fit (F)">Fit</button>
      <button id="z100" type="button" title="Actual pixels">1:1</button>
      <span id="zoomPct" class="muted"></span>
      <span class="muted">· scroll to zoom, drag to pan · both images move together</span>
    </div>
    <div id="panes">
      <div class="pane" id="paneL"><div class="cap">Original</div><div class="stage"><img alt="original image"></div></div>
      <div class="pane" id="paneR"><div class="cap">Annotated</div><div class="stage"><img alt="annotated image"><svg xmlns="http://www.w3.org/2000/svg"></svg></div></div>
      <div id="loading">Loading…</div>
    </div>
    <footer id="player">
      <button id="prev" type="button" title="Previous (←)">&#9664;</button>
      <button id="next" type="button" title="Next (→)">&#9654;</button>
      <input id="jump" type="number" min="1" value="1" title="Image number (G), Enter to go">
      <span id="total" class="muted"></span>
      <input id="slider" type="range" min="1" value="1">
    </footer>
  </section>
</div>
<div id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
